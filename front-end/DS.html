<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defasagem Salarial</title>
    <link rel="stylesheet" href="./styles/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body class="sidebar_collapsed">
    <header>
        <div class="img_container">
            <img src="img/Logo-Inova.jpg" alt="Logo-Inova" class="logo_inova">
        </div>
        <h1>Defasagem Salarial</h1>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
        <div class="sidebar_header">
            <a class="sidebar_brand" href="index.html" aria-label="Inova Dashboard">
                <span class="sidebar_brand_mark">IN</span>
                <span class="sidebar_brand_name">INOVA</span>
            </a>
            <button class="sidebar_toggle" id="sidebar-toggle" type="button" aria-label="Expandir menu" aria-expanded="false" title="Expandir menu">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <nav class="sidebar_nav">
            <a class="sidebar_link" href="index.html" data-nav-item title="Viabilidade Econômica">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-3M20 16V6"></path></svg>
                <span>Viabilidade Econômica</span>
            </a>
            <a class="sidebar_link active" href="DS.html" data-nav-item aria-current="page" title="Defasagem Salarial">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v5l3 2"></path></svg>
                <span>Defasagem Salarial</span>
            </a>
        </nav>
    </aside>

    <main class="DS_page">
        <section class="DS_intro">
            <form id="form-salarios" class="DS_filter">
                <div class="search_card">
                    <label class="label_municipio" for="inp-salario-municipio">Município</label>
                    <div class="search_container">
                        <input id="inp-salario-municipio" name="municipio" list="salarios-datalist" autocomplete="off" required>
                    <datalist id="salarios-datalist"></datalist>
                        <button type="submit">Consultar</button>
                    </div>
                </div>
            </form>
        </section>

        <section id="tabelas-salariais" class="DS_tables" aria-live="polite"></section>
    </main>

    <script src="./js/sidebar.js"></script>
    <script src="./js/salarios.js"></script>
</body>
</html>
