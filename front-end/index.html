<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analise de Viabilidade Economica</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <section class="TG_AVE">
        <section class="form_container">
            <form id="form-municipio" class="form_municipio">
                <div>
                    <label>Municipio: </label>
                    <input type="text" name="municipio" id="inp-municipio" list="datalist">
                    <datalist id="datalist"></datalist>
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </section>
        <section class="dados_container">
            <p>Município: <span id="municipio"></span></p>
            <div id="historico" class="tabela_container"></div>
            <div id="grafico-container" class="grafico">
                <canvas id="grafico"></canvas>
            </div>
        </section>
    </section>

    

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/charts.js"></script>
</body>
</html>
