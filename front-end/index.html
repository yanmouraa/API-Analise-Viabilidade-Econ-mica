<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analise de Viabilidade Economica</title>
    <link rel="stylesheet" href="./styles/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />

</head>
<body>
    <section class="TG_AVE">
        
        <form id="form-municipio" class="form_municipio">
            <div class="search_card">
                <label class="label_municipio">Municipio: </label>

                <div class="search_container">
                    <input type="text" name="municipio" id="inp-municipio" list="datalist">
                    <datalist id="datalist"></datalist>
                    <button type="submit"><span class="material-symbols-outlined" class="search_icon">search</span>Pesquisar</button>
                </div>

            </div>
        </form>
       
        <div class="dados_container">
            <p>Município: <span id="municipio"></span></p>
            <div id="historico" class="tabela_container"></div>
            <div id="grafico-container" class="grafico">
                <canvas id="grafico-ev-anual"></canvas>
                <canvas id="grafico-ev-acumulada"></canvas>
            </div>
        </div>
    </section>

    

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/charts.js"></script>
</body>
</html>
