<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section>
        <form id="form-municipio" action="">
            <div>
                <label for="">Municipio: </label>
                <input type="text" name="municipio" id="inp-municipio" list="datalist">
                <datalist id="datalist"></datalist>
            </div>
            <div>
                <label for="">Ano: </label>
                <input type="number" name="ano" id="inp-ano" list="datalist-ano">
                <datalist id="datalist-ano"></datalist>
            </div>
            <div>
                <button type="submit">Enviar</button>
            </div>
        </form>
    </section>

    <section>
        <p>Município: <span id="municipio"></span></p>
        <p>RREO - Receita Corrente Líquida: <span id="rcl"></span></p>
        <p>RGF - Despesa Total com Pessoas: <span id="dtp"></span></p>
        <p>RGF - Despesa Total com Pessoas %: <span id="dtp-percentual">A calcular</span></p>
        <p>RREO - Transferências FUNDEB: <span id="fundeb"></span></p>
    </section>

    <script src="./api.js"></script>
</body>
</html>
